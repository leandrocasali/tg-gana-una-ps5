<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Gamers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <img src="https://s3-sa-east-1.amazonaws.com/assets.pe.entel.mujeres.fit/wp-content/uploads/2026/07/tg-landing-ps5.jpg" alt="banner promocion gana un galaxy">
  </header>

  <main class="content">
    

    <div class="form-container" id="formContainer">
      <form id="phoneForm">
        <p>Ingresa tu número y podes ganar una Playstation 5</p><br>
        <div class="input-group">
          <span class="prefix">+58</span>
          <input type="number" id="phone" placeholder="Ingresa tu número" maxlength="10" required>
        </div>
        <small id="errorMsg" class="error"></small>
        <button type="submit">CONTINUAR</button>
      </form>
    </div>
    <p>Bs 69,05 c/imp diarios</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
